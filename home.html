<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <title>HOME</title>
    <link rel="stylesheet" href="/your-path-to-fontawesome/css/brands.css">
    <style>
        body {
            background-color: rgb(251, 250, 250);
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .logo-header {
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
        }

        .nav-bar {
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin: 20px 0;
            padding: 0;
        }

        .nav-bar li {
            margin: 10px 20px;
            font-size: 1em;
        }

        .nav-bar li a {
            color: black;
            text-decoration: none;
        }

        .nav-bar li a:hover {
            color: rgb(177, 102, 115);
        }

        .next-read {
            display: flex;
            justify-content: center;
        }

        .next-read img {
            width: 100%;
            height: auto;
            max-width: 600px;
            margin-bottom: 40px;
        }

        .books {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        .books h1 {
            font-size: 1.5em;
            margin-bottom: 30px;
        }

        .books-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            width: 100%;
        }

        .books-container a {
            text-decoration: none;
            color: inherit;
        }

        .col1, .col2, .col3 {
            flex: 1 1 300px;
            max-width: 30%;
            text-align: center;
        }

        .col1 img, .col2 img, .col3 img {
            width: 100%;
            height: auto;
        }

        footer {
            background-color: rgb(245, 188, 197);
            padding: 20px;
        }

        .footer-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            text-align: center;
        }

        .footer-container div {
            flex: 1 1 300px;
            margin: 10px 0;
        }

        .coll1 img, .coll2 img{
            max-height: 35px;
            margin: 5px 10px;
        }

        .coll3 img{
            max-height: 150px;
            margin: 5px 10px;
        }

        .coll1 h1, .coll2 h1, .coll2 a, .coll3 h1 {
            font-size: 1em;
            margin: 0;
        }

        @media (max-width: 768px) {
            .nav-bar li {
                font-size: 1.2em;
                margin: 5px 10px;
            }

            .books h1 {
                font-size: 2em;
            }

            .col1, .col2, .col3 {
                max-width: 100%;
            }

            .footer-container div {
                flex: 1 1 100%;
            }

            .coll1 h1, .coll2 h1, .coll3 h1 {
                font-size: 1.5em;
            }

            .coll2 a{
                font-size: 1em;
            }
        }

        @media (max-width: 480px) {
            .nav-bar li {
                font-size: 1em;
                margin: 5px;
            }

            .books h1 {
                font-size: 1.5em;
            }

            .coll1 h1, .coll2 h1, .coll2 a, .coll3 h1 {
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-header">
            <a href="#" class="logo">
                <img src="home_img/output-onlinegiftools.gif" alt="brand">
            </a>
            <nav>
                <ul class="nav-bar">
                    <li><a href="home.html">HOME</a></li>
                    <li><a href="aboutMe.html">ABOUT ME</a></li>
                    <li><a href="Books.html">BOOKS</a></li>
                    <li><a href="ContactMe.html">CONTACT ME</a></li>
                </ul>
            </nav>
        </div>
        <div class="next-read">
            <img src="home_img/CURRENTLAST READ (1).png" alt="">
        </div>
    </header>
    <main>
        <section>
            <div class="books">
                <h1>BOOKS</h1>
                <div class="books-container">
                    <div class="col1">
                        <a href="Books.html">
                            <img src="home_img/bookRead.jpg" alt="">
                            <h2>BOOK READ</h2>
                        </a>
                    </div>
                    <div class="col2">
                        <a href="ToBeRead.html">
                            <img src="home_img/ToBeRead.jpg" alt="">
                            <h2>TO BE READ</h2>
                        </a>
                    </div>
                    <div class="col3">
                        <a href="TopReads.html">
                            <img src="home_img/topReads.jpg" alt="">
                            <h2>TOP READS</h2>
                        </a>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <div class="footer-container">
            <div class="coll1">
                <h1>CONNECT WITH ME</h1>
                <a href="https://www.instagram.com/elbook01/?next=%2F" target="_blank" class="insta-handle" rel="noopener noreferrer"><img src="footer_img/instaIcon (2).png" alt=""></a>
                <a href="https://www.goodreads.com/user/show/149333952?ref=nav_profile_l" target="_blank" rel="noopener noreferrer"><img src="footer_img/goodreads_icon_137540.png" alt=""></a>
                <a href="https://open.spotify.com/user/ec1wy3ga1fw86eoyhwwu9ymvw?si=afbb8e08ebb54c1c" target="_blank" rel="noopener noreferrer"><img src="footer_img/saavn.png" alt=""></a>
                <a href="https://www.facebook.com/profile.php?id=61556339263205" target="_blank" rel="noopener noreferrer"><img src="footer_img/facebook.png" alt=""></a>
            </div>
            <div class="coll2">
                <h1>SITEMAP</h1>
                <ul class="go-through">
                    <li><a href="home.html">HOME</a></li>
                    <li><a href="aboutMe.html">ABOUT ME</a></li>
                    <li><a href="Books.html">BOOKS</a></li>
                    <li><a href="ContactMe.html">CONTACT ME</a></li>
                </ul>
            </div>
            <div class="coll3">
                <img src="home_img/output-onlinegiftools.gif" alt="brand">
            </div>
        </div>
    </footer>
</body>
</html>
